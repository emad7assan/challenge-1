<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  function bytes(s){
    var b = atob(s), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var err = document.getElementById('err');
    err.textContent = '';
    try {
      var pw = document.getElementById('pw').value;
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(P.s), iterations: P.i, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.v)}, key, bytes(P.d));
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (x) {
      err.textContent = 'Wrong password. Try again.';
    }
  });
})();
</script>
